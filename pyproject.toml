# Code quality configuration for the Cabici backend.
#
# Tooling is installed from requirements/dev.txt and run locally via
# pre-commit (see .pre-commit-config.yaml) and in CI
# (.github/workflows/run-tests.yml).

[tool.black]
line-length = 120
target-version = ["py314"]
extend-exclude = '''
/(
    \.venv
  | result-uploads
  | races/apps/cabici/migrations
)/
'''

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    ".venv",
    "result-uploads",
    # Historical migrations are machine generated and left unformatted.
    "races/apps/cabici/migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    # Black owns line length.
    "E501",
    # Legacy %-formatting in log/error messages; new code uses f-strings.
    "UP031",
    # if/else -> ternary rewrites hurt readability in the import/result paths.
    "SIM108",
    # dict()/list() constructor calls are stylistic.
    "C408",
]

[tool.ruff.lint.per-file-ignores]
# Settings modules deliberately use star imports.
"races/settings/*" = ["F401", "F403", "F405"]
# Legacy tests: star imports pull in fixtures/helpers, and some unused locals
# document side effects. Revisit when the tests are rewritten in Phase 2.
"races/apps/cabici/tests/*" = ["F403", "F405", "F841", "B007", "SIM113", "SIM117"]
# Club scrapers: their fallback paths deliberately swallow markup/parse errors
# from third party pages, narrowing them changes ingest behaviour.
"races/ingest/*" = ["E722"]

[tool.coverage.run]
source = ["races"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "races/settings/*",
    "races/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Ratchet: the CI gate enforces this floor. Measured at 44% after the Phase 1
# cleanup; Phase 2 (API completion) raises it towards the >80% target in
# MODERNIZATION_PLAN.md.
fail_under = 42

[tool.mypy]
python_version = "3.14"
mypy_path = "."
ignore_missing_imports = true
# Legacy code is not annotated yet; typing is introduced with the new API
# modules in Phase 2 rather than as a big-bang migration.
check_untyped_defs = false

[[tool.mypy.overrides]]
# Settings modules reassign names imported from base.py, which the type checker
# cannot model. They are covered by the Django system checks step in CI.
module = "races.settings.*"
ignore_errors = true

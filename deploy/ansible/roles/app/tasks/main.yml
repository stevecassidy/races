---
- name: Ensure application directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: '0755'

- name: Clone or update application repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_version }}"
    force: yes

- name: Create production environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env.production"
    mode: '0600'

# --- Docker network and compose via CLI (avoids collection dependency issues) ---

- name: Check if Docker network exists
  ansible.builtin.command: docker network inspect {{ app_name }}
  register: network_check
  failed_when: false
  changed_when: false

- name: Create Docker network
  ansible.builtin.command: docker network create {{ app_name }}
  when: network_check.rc != 0
  changed_when: true

- name: Start application with Docker Compose
  ansible.builtin.command: >
    docker compose -f deploy/docker-compose.production.yml up -d --build
  args:
    chdir: "{{ app_dir }}"
  environment:
    COMPOSE_PROJECT_NAME: "{{ app_name }}"
  changed_when: true

# Migrations and collectstatic run automatically in the container startup command
# defined in docker-compose.production.yml.  If you need to run management commands
# manually, SSH to the droplet and use:
#   docker compose -f deploy/docker-compose.production.yml exec web python bin/production.py <command>

---
- name: Install Certbot and Nginx plugin
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present

- name: Check if certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ app_domain }}/cert.pem"
  register: cert_stat

- name: Check if nginx config already contains SSL directives
  ansible.builtin.command: grep -q "ssl_certificate" /etc/nginx/sites-enabled/{{ app_name }}.conf
  register: ssl_in_config
  failed_when: false
  changed_when: false

- name: Obtain or re-apply SSL certificate
  ansible.builtin.command: >
    certbot --nginx
    -d {{ app_domain }}
    --non-interactive
    --agree-tos
    --email {{ certbot_email }}
    --redirect
    --hsts
    --staple-ocsp
  when: not cert_stat.stat.exists or ssl_in_config.rc != 0
  changed_when: true

- name: Ensure Certbot timer is enabled
  ansible.builtin.systemd:
    name: certbot.timer
    state: started
    enabled: yes

---
- name: Deploy cabici Django application
  hosts: cabici
  become: yes

  vars:
    pip_install_packages:
      - docker
      - docker-compose

  pre_tasks:
    - name: Set primary domain from first entry in app_domains
      ansible.builtin.set_fact:
        app_domain: "{{ app_domains[0] }}"

  roles:
    - base
    - docker
    - volume
    - app
    - nginx
    - certbot

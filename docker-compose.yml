services:
  web:
    build: .
    command: >
      /bin/sh -c "python bin/production.py collectstatic --noinput &&
      python bin/production.py migrate &&
      gunicorn -c ./gunicorn.config.py races.wsgi"
    volumes:
      - .:/usr/src/app/
    ports:
      - 8000:8000
    env_file:
      - ./.env.dev
    depends_on:
      db:
        condition: service_healthy

  db:
      image: postgres:17-alpine
      volumes:
        - postgres_data:/var/lib/postgresql/data/
      environment:
        - POSTGRES_USER=cabici
        - POSTGRES_PASSWORD=cabici
        - POSTGRES_DB=cabici
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U cabici -d cabici"]
        interval: 2s
        timeout: 5s
        retries: 20

volumes:
  postgres_data:

services:
  web:
    build: .
    command: >
      /bin/sh -c "python -m pip install --upgrade 'setuptools<81' &&
      python bin/production.py collectstatic --noinput &&
      python bin/production.py migrate &&
      gunicorn -c ./gunicorn.config.py races.wsgi"
    volumes:
      - .:/usr/src/app/
    ports:
      - 8000:8000
    env_file:
      - ./.env.dev
    depends_on:
      - db
  db:
      image: postgres:12.0-alpine
      volumes:
        - postgres_data:/var/lib/postgresql/data/
      environment:
        - POSTGRES_USER=cabici
        - POSTGRES_PASSWORD=cabici
        - POSTGRES_DB=cabici

volumes:
  postgres_data:

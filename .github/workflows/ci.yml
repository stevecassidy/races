# CI for the Cabici backend.
#
# Runs on the modernization branch and on pull requests targeting it, so the
# Phase 1 quality gates (lint, format, migrations, tests, coverage) are
# exercised before anything lands.

name: CI

on:
  push:
    branches: ["modernization", "master"]
  # No branch filter here on purpose: stacked branches (a PR whose base is
  # another open feature branch, e.g. the A1/A2 chain) otherwise get no CI at
  # all, which defeats the point of gating merges on review.
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, format and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check --diff .

      - name: System checks
        run: python bin/develop.py check

      - name: No missing migrations
        run: python bin/develop.py makemigrations --check --dry-run

      - name: Tests with coverage
        run: |
          coverage run --rcfile=pyproject.toml bin/runtests.py
          coverage report --rcfile=pyproject.toml

      # Shallow for now: legacy modules are unannotated so mypy only checks
      # signatures it can infer. Depth increases in Phase 2.
      - name: Mypy
        run: mypy races
